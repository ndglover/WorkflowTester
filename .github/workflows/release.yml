name: Release pipeline
run-name: Release pipeline - ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'src/WorkflowTester.Lib/**'
      - 'Directory.Build.props'
      - 'release-please-config.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing draft to prepare, e.g. dotnet/v0.1.3'
        type: string
      release_sha:
        description: 'Source SHA for the selected draft; supply both optional fields together'
        type: string
      publish:
        description: 'Publish after approval; disable to stage a candidate only'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: 1 - Prepare release or refresh candidate
    runs-on: ubuntu-latest
    concurrency:
      group: release-plan-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
    steps:
      - name: Validate optional source selection
        run: |
          if [[ -n "$RELEASE_TAG" || -n "$RELEASE_SHA" ]]; then
            [[ "$RELEASE_TAG" =~ ^dotnet/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}

      - name: Create draft from a merged release PR
        if: ${{ inputs.release_tag == '' }}
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Decide the next stage
        id: plan
        run: |
          source_sha=${RELEASE_SHA:-$GITHUB_SHA}
          if [[ "$GITHUB_REF_NAME" == main ]] && \
             [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$source_sha" ]]; then
            echo 'candidate=false' >> "$GITHUB_OUTPUT"
            echo 'needs_pr=false' >> "$GITHUB_OUTPUT"
            echo 'Superseded by a newer main commit. Use the newest pipeline run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$RELEASE_TAG" ]]; then
            version=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$source_sha" \
              --jq .content | base64 --decode | jq -er '."src/WorkflowTester.Lib"')
            RELEASE_TAG="dotnet/v$version"
          fi
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          info=$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)][0] // null' <<< "$releases")
          if [[ "$info" == null ]] || [[ "$(jq -r .draft <<< "$info")" != true ]]; then
            if [[ -n "$SELECTED_TAG" ]]; then
              echo '::error::The selected release must be an existing draft.'
              exit 1
            fi
            echo 'candidate=false' >> "$GITHUB_OUTPUT"
            echo 'needs_pr=true' >> "$GITHUB_OUTPUT"
            echo 'Stage: prepare or update the next version/changelog PR.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=${RELEASE_TAG#dotnet/v}
          code=$(curl -sS --retry 3 --head --output /dev/null --write-out '%{http_code}' \
            "https://api.nuget.org/v3-flatcontainer/workflowtester.lib/$version/workflowtester.lib.$version.nupkg")
          if grep -Fq '<!-- publication-started -->' <<< "$(jq -r .body <<< "$info")" || [[ "$code" == 200 ]]; then
            echo 'candidate=false' >> "$GITHUB_OUTPUT"
            echo 'needs_pr=false' >> "$GITHUB_OUTPUT"
            echo 'Stage: publication has started. Resume the original release run; this version cannot be rebuilt.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$code" = 404
          echo 'candidate=true' >> "$GITHUB_OUTPUT"
          echo 'needs_pr=false' >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Stage: build and refresh draft `%s` from `%s`.\n' "$RELEASE_TAG" "$source_sha" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SELECTED_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}

      - name: Maintain the next release PR
        if: ${{ steps.plan.outputs.needs_pr == 'true' }}
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Supersede older approvals for this workflow branch
        if: ${{ steps.plan.outputs.candidate == 'true' }}
        run: |
          branch=${GITHUB_REF_NAME//\//%2F}
          waiting=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=waiting&branch=$branch&per_page=100" \
            --jq '.workflow_runs[].id')
          for run_id in $waiting; do
            if [[ "$run_id" != "$GITHUB_RUN_ID" ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" \
                || echo "::warning::Run $run_id changed state before it could be superseded."
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

  pack:
    name: 2 - Build candidate
    needs: plan
    if: ${{ needs.plan.outputs.candidate == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.package.outputs.source_sha }}
    permissions:
      contents: read
    steps:
      - name: Validate release inputs
        run: |
          [[ "$RELEASE_TAG" =~ ^dotnet/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack matching release version
        id: package
        run: |
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$RELEASE_SHA"
          version=$(dotnet msbuild src/WorkflowTester.Lib/WorkflowTester.Lib.csproj -getProperty:VersionPrefix)
          test "$version" = "${RELEASE_TAG#dotnet/v}"
          dotnet pack src/WorkflowTester.Lib/WorkflowTester.Lib.csproj -c Release -o artifacts -p:VersionSuffix=
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  prepare_candidate:
    name: 3 - Stage candidate for testing
    concurrency:
      group: candidate-${{ github.repository }}-${{ needs.plan.outputs.release_tag }}
      cancel-in-progress: false
    needs: [plan, pack]
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.candidate.outputs.package_name }}
      package_sha256: ${{ steps.candidate.outputs.package_sha256 }}
      ready: ${{ steps.fresh.outputs.ready }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Refresh draft source and release notes
        run: |
          info=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,body)
          test "$(jq -r .isDraft <<< "$info")" = true
          if grep -Fq '<!-- publication-started -->' <<< "$(jq -r .body <<< "$info")"; then
            echo '::error::Publication has started; resume its original run instead of replacing this candidate.'
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
          fi
          previous_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select((.isDraft | not) and (.tagName | startswith("dotnet/v")))][0].tagName // empty')
          notes_args=(-f tag_name="$RELEASE_TAG" -f target_commitish="$RELEASE_SHA")
          if [[ -n "$previous_tag" ]]; then notes_args+=(-f previous_tag_name="$previous_tag"); fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${notes_args[@]}" \
            --jq .body > release-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --notes-file release-notes.md
          test "$BUILT_SHA" = "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
          BUILT_SHA: ${{ needs.pack.outputs.source_sha }}
      - name: Verify existing release tag
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          if tag_refs=$(git ls-remote --exit-code --tags \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$tag_ref" "$tag_ref^{}"); then
            # Prefer the peeled commit for annotated tags; lightweight tags point directly at it.
            tag_sha=$(awk -v ref="$tag_ref" '
              $2 == ref { direct = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print peeled ? peeled : direct }
            ' <<< "$tag_refs")
            if [[ "$tag_sha" != "$BUILT_SHA" ]]; then
              echo "::error::The existing release tag does not point to the package build commit."
              exit 1
            fi
          else
            status=$?
            # Exit 2 means no matching ref. Authentication/network errors must fail closed.
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not verify the release tag."
              exit "$status"
            fi
          fi
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          BUILT_SHA: ${{ needs.pack.outputs.source_sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package
          path: artifacts

      # Use the same predicate generator and signer as attest-build-provenance v2.
      # Its default dependency describes the workflow commit, not the checked-out source.
      - uses: actions/attest-build-provenance/predicate@1176ef556905f349f669722abf30bce1a6e16e01 # predicate@1.1.5
        id: workflow_provenance

      - name: Record actual package source in provenance
        run: |
          test "$BUILT_SHA" = "$RELEASE_SHA"
          jq --arg source_sha "$BUILT_SHA" \
            --arg source_uri "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$BUILT_SHA" \
            --arg release_tag "$RELEASE_TAG" '
              .buildDefinition.externalParameters.release = {
                tag: $release_tag,
                source: {uri: $source_uri, digest: {gitCommit: $source_sha}}
              }
              | .buildDefinition.resolvedDependencies |= map(. + {name: "workflow"})
              | .buildDefinition.resolvedDependencies += [{
                  name: "release-source", uri: $source_uri, digest: {gitCommit: $source_sha}
                }]
            ' <<< "$WORKFLOW_PREDICATE" > artifacts/release-provenance.json
        env:
          WORKFLOW_PREDICATE: ${{ steps.workflow_provenance.outputs.predicate }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
          BUILT_SHA: ${{ needs.pack.outputs.source_sha }}

      - uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2.4.0
        id: release_provenance
        with:
          subject-path: 'artifacts/*.nupkg'
          predicate-type: 'https://slsa.dev/provenance/v1'
          predicate-path: 'artifacts/release-provenance.json'

      - name: Verify attested package source
        run: |
          jq -r '.dsseEnvelope.payload' "$BUNDLE_PATH" | base64 --decode \
            | jq -e --arg sha "$BUILT_SHA" \
                --arg uri "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$BUILT_SHA" '
                .predicateType == "https://slsa.dev/provenance/v1"
                and .predicate.buildDefinition.externalParameters.release.source.digest.gitCommit == $sha
                and any(.predicate.buildDefinition.resolvedDependencies[];
                  .name == "release-source" and .uri == $uri and .digest.gitCommit == $sha)
              ' > /dev/null
        env:
          BUNDLE_PATH: ${{ steps.release_provenance.outputs.bundle-path }}
          BUILT_SHA: ${{ needs.pack.outputs.source_sha }}

      - name: Attach candidate and provenance to draft
        id: candidate
        run: |
          packages=(artifacts/*.nupkg)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          package_name=${packages[0]##*/}
          package_sha256=$(sha256sum "${packages[0]}" | cut -d ' ' -f 1)
          cp "$BUNDLE_PATH" artifacts/release-attestation.sigstore.json
          gh release upload "$RELEASE_TAG" "${packages[0]}" \
            artifacts/release-attestation.sigstore.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$package_sha256" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          BUNDLE_PATH: ${{ steps.release_provenance.outputs.bundle-path }}

      - name: Verify downloadable candidate and show review details
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PACKAGE_NAME" --pattern release-attestation.sigstore.json --dir staged
          printf '%s  %s\n' "$PACKAGE_SHA256" "staged/$PACKAGE_NAME" | sha256sum --check
          gh attestation verify "staged/$PACKAGE_NAME" --repo "$GITHUB_REPOSITORY" \
            --bundle staged/release-attestation.sigstore.json \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          release_url=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          {
            printf '### Release candidate ready\n\n'
            printf '[Download and test the draft candidate](%s) before approving NuGet publication.\n\n' "$release_url"
            printf -- '- Package: `%s`\n- Source commit: `%s`\n- SHA-256: `%s`\n' "$PACKAGE_NAME" "$BUILT_SHA" "$PACKAGE_SHA256"
            printf '\nThe publishing job downloads this same asset and checks this digest.\n'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          BUILT_SHA: ${{ needs.pack.outputs.source_sha }}
          PACKAGE_NAME: ${{ steps.candidate.outputs.package_name }}
          PACKAGE_SHA256: ${{ steps.candidate.outputs.package_sha256 }}

      - name: Confirm this candidate is still current
        id: fresh
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]] && \
             [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$RELEASE_SHA" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit arrived during preparation. Its run will replace this candidate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}

  publish_nuget:
    name: 4 - Approve and publish to NuGet
    concurrency:
      group: candidate-${{ github.repository }}-${{ needs.plan.outputs.release_tag }}
      cancel-in-progress: false
    if: ${{ needs.prepare_candidate.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    needs: [plan, pack, prepare_candidate]
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: write
      id-token: write
    steps:
      # Draft releases require push access to see; keep this in the write-enabled job.
      - name: Verify draft release and source commit
        run: |
          release_info=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv')
          IFS=$'\t' read -r is_draft target_commit <<< "$release_info"
          if [[ "$is_draft" != true ]]; then
            echo "::error::The GitHub release must still be a draft."
            exit 1
          fi
          if [[ "$target_commit" != "$RELEASE_SHA" ]]; then
            echo "::error::The draft release targetCommitish does not match release_sha."
            exit 1
          fi
          if [[ "$BUILT_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::The package build commit does not match release_sha."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
          BUILT_SHA: ${{ needs.pack.outputs.source_sha }}

      - name: Verify existing release tag
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          if tag_refs=$(git ls-remote --exit-code --tags \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$tag_ref" "$tag_ref^{}"); then
            # Prefer the peeled commit for annotated tags; lightweight tags point directly at it.
            tag_sha=$(awk -v ref="$tag_ref" '
              $2 == ref { direct = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print peeled ? peeled : direct }
            ' <<< "$tag_refs")
            if [[ "$tag_sha" != "$BUILT_SHA" ]]; then
              echo "::error::The existing release tag does not point to the package build commit."
              exit 1
            fi
          else
            status=$?
            # Exit 2 means no matching ref. Authentication/network errors must fail closed.
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not verify the release tag."
              exit "$status"
            fi
          fi
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          BUILT_SHA: ${{ needs.pack.outputs.source_sha }}

      - name: Download and verify the reviewed candidate
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PACKAGE_NAME" --pattern release-attestation.sigstore.json --dir artifacts
          printf '%s  %s\n' "$PACKAGE_SHA256" "artifacts/$PACKAGE_NAME" | sha256sum --check
          gh attestation verify "artifacts/$PACKAGE_NAME" --repo "$GITHUB_REPOSITORY" \
            --bundle artifacts/release-attestation.sigstore.json \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          jq -r '.dsseEnvelope.payload' artifacts/release-attestation.sigstore.json | base64 --decode \
            | jq -e --arg sha "$BUILT_SHA" \
                --arg uri "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$BUILT_SHA" '
                .predicateType == "https://slsa.dev/provenance/v1"
                and any(.predicate.buildDefinition.resolvedDependencies[];
                  .name == "release-source" and .uri == $uri and .digest.gitCommit == $sha)
              ' > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          BUILT_SHA: ${{ needs.pack.outputs.source_sha }}
          PACKAGE_NAME: ${{ needs.prepare_candidate.outputs.package_name }}
          PACKAGE_SHA256: ${{ needs.prepare_candidate.outputs.package_sha256 }}

      - name: Freeze the approved candidate before publication
        run: |
          body=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if ! grep -Fq '<!-- publication-started -->' <<< "$body"; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
            printf '%s\n\n<!-- publication-started -->\n' "$body" > publication-notes.md
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file publication-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          # Individual NuGet username that created the Trusted Publishing policy.
          # Package ownership is selected separately in that policy.
          user: ${{ vars.NUGET_USER }}

      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  publish_release:
    name: 5 - Publish GitHub release
    needs: [plan, publish_nuget, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify existing release tag
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          if tag_refs=$(git ls-remote --exit-code --tags \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$tag_ref" "$tag_ref^{}"); then
            # Prefer the peeled commit for annotated tags; lightweight tags point directly at it.
            tag_sha=$(awk -v ref="$tag_ref" '
              $2 == ref { direct = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print peeled ? peeled : direct }
            ' <<< "$tag_refs")
            if [[ "$tag_sha" != "$BUILT_SHA" ]]; then
              echo "::error::The existing release tag does not point to the package build commit."
              exit 1
            fi
          else
            status=$?
            # Exit 2 means no matching ref. Authentication/network errors must fail closed.
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not verify the release tag."
              exit "$status"
            fi
          fi
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          BUILT_SHA: ${{ needs.pack.outputs.source_sha }}

      - name: Publish immutable release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
