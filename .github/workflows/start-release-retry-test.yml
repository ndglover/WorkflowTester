name: Start release retry test
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/start-release-retry-test.yml
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
    - name: Create test draft and dispatch release
      run: "if gh release view dotnet/v0.1.1 --repo \"$GITHUB_REPOSITORY\" --json\
        \ isDraft,targetCommitish > existing-release.json; then\n  test \"$(jq -r\
        \ .isDraft existing-release.json)\" = true\n  source_sha=$(jq -r .targetCommitish\
        \ existing-release.json)\nelse\n  gh release create dotnet/v0.1.1 --repo \"\
        $GITHUB_REPOSITORY\" --draft --target \"$GITHUB_SHA\" \\\n    --title 'Workflow\
        \ retry verification 0.1.1' \\\n    --notes 'Controlled retry test of build,\
        \ NuGet push, asset attachment, and release publication.'\n  source_sha=\"\
        $GITHUB_SHA\"\nfi\ngh workflow run release.yml --repo \"$GITHUB_REPOSITORY\"\
        \ --ref main \\\n  -f release_tag=dotnet/v0.1.1 -f release_sha=\"$source_sha\"\
        \ -f exercise_retries=true\n"
      env:
        GH_TOKEN: ${{ github.token }}
