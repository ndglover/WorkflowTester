name: Publish Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to build a preview package from'
        required: true
        type: number

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - id: version
        run: echo "version=0.1.0-pr.${{ inputs.pr_number }}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: dotnet pack src/WorkflowTester.Lib/WorkflowTester.Lib.csproj -c Release -o artifacts
        env:
          MinVerVersionOverride: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-preview-package
          path: artifacts/*.nupkg

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget-preview
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-preview-package
          path: artifacts

      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ inputs.pr_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Preview package published: `WorkflowTester.Lib ${{ needs.pack.outputs.version }}`\n\n```\ndotnet add package WorkflowTester.Lib --version ${{ needs.pack.outputs.version }} --source https://api.nuget.org/v3/index.json\n```'
            })
